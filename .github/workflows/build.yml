name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb ffmpeg

      - name: Configure (macOS universal binary)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Catch the exact packaging faults that make a VST3 invisible to a DAW:
      # missing manifest, an incomplete bundle, or an architecture omitted
      # from a supposedly universal macOS build.
      - name: Inspect macOS plug-in bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage=build/Dyrekreds_artefacts/Release
          vst3="$stage/VST3/Dyrekreds.vst3"
          au="$stage/AU/Dyrekreds.component"
          app="$stage/Standalone/Dyrekreds.app"
          test -f "$vst3/Contents/Resources/moduleinfo.json"
          # The VST3 specification defines moduleinfo.json as JSON5.  Use its
          # reference parser so valid trailing commas are accepted while the
          # required VST3 manifest schema is still checked.
          ./build/DyrekredsVST3ManifestValidator "$vst3/Contents/Resources/moduleinfo.json"
          for binary in "$vst3/Contents/MacOS/Dyrekreds" "$au/Contents/MacOS/Dyrekreds" "$app/Contents/MacOS/Dyrekreds"; do
            test -x "$binary"
            architectures="$(lipo -archs "$binary")"
            echo "$architectures" | grep -qw arm64
            echo "$architectures" | grep -qw x86_64
          done

      - name: Run unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/DyrekredsTests_artefacts/Release/DyrekredsTests.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ./build/DyrekredsTests_artefacts/Release/DyrekredsTests
          else
            xvfb-run --auto-servernum ./build/DyrekredsTests_artefacts/Release/DyrekredsTests
          fi

      # Strictness 10 is the ceiling: every test pluginval has, including the
      # allocation and thread-safety checks.
      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pluginval_Windows.zip > /dev/null
            ./pluginval.exe --strictness-level 10 --validate "build/Dyrekreds_artefacts/Release/VST3/Dyrekreds.vst3"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q -o pluginval_macOS.zip
            pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate "build/Dyrekreds_artefacts/Release/VST3/Dyrekreds.vst3"
          else
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
            unzip -q -o pluginval_Linux.zip
            xvfb-run --auto-servernum ./pluginval --strictness-level 10 --validate "build/Dyrekreds_artefacts/Release/VST3/Dyrekreds.vst3"
          fi

      # The AU wrapper only registers from the user plug-in folder.
      - name: Validate AU with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Dyrekreds_artefacts/Release/AU/Dyrekreds.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Dyrk Fuim
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate ~/Library/Audio/Plug-Ins/Components/Dyrekreds.component

      # Public macOS releases must be signed and notarised.  Pull requests and
      # branch builds remain unsigned, which keeps contributors from needing
      # access to the release credentials.
      - name: Require macOS release credentials
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for value in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value}" || { echo "Missing required macOS release secret: $value" >&2; exit 1; }
          done

      - name: Install macOS signing certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          compatible_certificate="$RUNNER_TEMP/developer-id-compatible.p12"
          keychain="$RUNNER_TEMP/dyrekreds-signing.keychain-db"
          if ! printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"; then
            echo "MACOS_CERTIFICATE_BASE64 is not valid base64." >&2
            exit 1
          fi
          test -s "$certificate" || { echo "MACOS_CERTIFICATE_BASE64 decoded to an empty file." >&2; exit 1; }
          # Check the PKCS#12 MAC before creating a keychain.  This makes a
          # mismatched export password or a wrong/corrupt P12 explicit without
          # logging either secret.
          if ! openssl pkcs12 -in "$certificate" -passin env:MACOS_CERTIFICATE_PASSWORD -noout > /dev/null 2>&1; then
            echo "The decoded P12 cannot be opened with MACOS_CERTIFICATE_PASSWORD. Replace MACOS_CERTIFICATE_BASE64 and MACOS_CERTIFICATE_PASSWORD together from one fresh P12 export." >&2
            exit 1
          fi
          # security(1) on the hosted macOS images can reject newer PKCS#12
          # PBES2/AES containers even though OpenSSL verifies their MAC.  Keep
          # the certificate and private key, but re-wrap them with the
          # long-supported PKCS#12 algorithms accepted by Security.framework.
          # Nothing is printed: both the source and temporary re-wrapped P12
          # stay in RUNNER_TEMP and retain the existing secret password.
          set -o pipefail
          if ! openssl pkcs12 -in "$certificate" -passin env:MACOS_CERTIFICATE_PASSWORD -nodes 2>/dev/null \
            | openssl pkcs12 -export -out "$compatible_certificate" -passout env:MACOS_CERTIFICATE_PASSWORD \
                -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 > /dev/null 2>&1; then
            echo "Could not re-wrap the decoded P12 in the macOS-compatible PKCS#12 format." >&2
            exit 1
          fi
          test -s "$compatible_certificate" || { echo "The macOS-compatible P12 is empty." >&2; exit 1; }
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$compatible_certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          if ! security find-identity -v -p codesigning "$keychain" | grep -F -- "\"$MACOS_SIGNING_IDENTITY\"" > /dev/null; then
            echo "The imported P12 does not contain the MACOS_SIGNING_IDENTITY codesigning identity." >&2
            exit 1
          fi
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"

      - name: Sign and notarise macOS release bundles
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/sign-and-notarise-macos.sh build/Dyrekreds_artefacts/Release

      # pluginval has no CLAP support; clap-validator is the free-audio tool.
      # Pinned to an exact release asset because the names carry a build suffix.
      # The state-reproducibility tests are excluded: clap-juce-extensions (at
      # upstream head) fails them for every JUCE/APVTS plugin, Dyrekreds included;
      # values restored via setStateInformation read back as defaults through
      # the CLAP params extension. Re-enable once the wrapper is fixed upstream.
      - name: Validate CLAP with clap-validator
        shell: bash
        run: |
          base=https://github.com/free-audio/clap-validator/releases/download/0.4.1
          stem=clap-validator-0.4.1-127-g152b982
          mkdir -p validator
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sLO "$base/$stem-windows.zip"
            7z x -y "$stem-windows.zip" -ovalidator > /dev/null
            validator/clap-validator.exe validate -x state-reproducibility "build/Dyrekreds_artefacts/Release/CLAP/Dyrekreds.clap"
          else
            # The unix release zips wrap a tarball with the binary at binaries/clap-validator.
            [ "$RUNNER_OS" = "macOS" ] && asset="$stem-macos-universal.zip" || asset="$stem-ubuntu-22.04.zip"
            curl -sLO "$base/$asset"
            unzip -q -o "$asset" -d validator
            tar xzf "$(find validator -name '*.tar.gz' | head -1)" -C validator
            bin=$(find validator -type f -name clap-validator | head -1)
            chmod +x "$bin"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run --auto-servernum "$bin" validate -x state-reproducibility "build/Dyrekreds_artefacts/Release/CLAP/Dyrekreds.clap"
            else
              "$bin" validate -x state-reproducibility "build/Dyrekreds_artefacts/Release/CLAP/Dyrekreds.clap"
            fi
          fi

      - name: Package
        shell: bash
        run: |
          mkdir dist
          stage=build/Dyrekreds_artefacts/Release
          cp LICENSE "$stage/LICENSE.txt"
          cp NOTICE.txt "$stage/NOTICE.txt"
          mkdir "$stage/licenses"
          cp licenses/AGPL-3.0.txt "$stage/licenses/JUCE-AGPL-3.0.txt"
          cp assets/fonts/OFL-UnifrakturMaguntia.txt assets/fonts/OFL-IMFellEnglish.txt "$stage/licenses/"
          cp JUCE/modules/juce_audio_processors_headless/format_types/VST3_SDK/LICENSE.txt "$stage/licenses/VST3-SDK-MIT.txt"
          cp modules/clap-juce-extensions/clap-libs/clap/LICENSE "$stage/licenses/CLAP-MIT.txt"
          cp modules/clap-juce-extensions/LICENSE.md "$stage/licenses/clap-juce-extensions-MIT.txt"
          cd "$stage"
          dirs="LICENSE.txt NOTICE.txt licenses"
          for d in VST3 CLAP AU Standalone; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "../../../dist/Dyrekreds-Windows.zip" --format=zip $dirs
          else
            # tar preserves the executable bits that zip would lose
            tar czf "../../../dist/Dyrekreds-$RUNNER_OS.tar.gz" $dirs
          fi

      - name: Render audio demos
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --parallel --target DyrekredsDemoRender
          xvfb-run --auto-servernum ./build/DyrekredsDemoRender_artefacts/Release/DyrekredsDemoRender demo-out
          sed -i 's/\r$//' demo-out/segments.txt
          i=0
          while IFS='|' read -r _ name start dur; do
            i=$((i+1))
            slug=$(printf "%02d-%s" "$i" "$(echo "$name" | tr 'A-Z' 'a-z' | tr ' ' '-')")
            ffmpeg -nostdin -loglevel error -y -ss "$start" -t "$dur" -i demo-out/dyrekreds-demo.wav \
              -c:a libmp3lame -b:a 256k "dist/$slug.mp3"
          done < demo-out/segments.txt
          ffmpeg -nostdin -loglevel error -y -i demo-out/dyrekreds-demo.wav -c:a libmp3lame -b:a 256k dist/dyrekreds-demo-full.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: Dyrekreds-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/Dyrekreds-*
            dist/dyrekreds-demo-full.mp3
